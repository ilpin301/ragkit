# Base template. Copied verbatim into <BASE>\lightrag\ by new_base.ps1.
# No `build:` block on purpose: a base folder holds no Dockerfile, so a failed
# pull must fail loudly rather than try to build from an empty context.
services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./.env:/app/.env
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      # The container must listen on 0.0.0.0 to be reachable via the published port.
      # SECURITY: LIGHTRAG_API_KEY is set in .env by new_base.ps1 - without it
      # every endpoint on the published port is public.
      HOST: "0.0.0.0"
      PORT: "9621"
      # Core LightRAG defaults to NanoVectorDBStorage; only the API server reads
      # this. rag_ingest.py picks the same value up from .env separately.
      LIGHTRAG_VECTOR_STORAGE: "${LIGHTRAG_VECTOR_STORAGE:-NanoVectorDBStorage}"
      # Container-side URL. .env carries the HOST-side one for rag_ingest.py;
      # load_dotenv(override=False) means this real env var wins in here.
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant

  qdrant:
    # Vector backend. Pinned - a floating tag would swap the storage engine
    # under a live store. Storage is a named volume on ext4 inside the WSL
    # VHDX, never a bind mount onto a Windows drive: Qdrant needs real local-fs
    # fsync/mmap semantics and drvfs/9p does not provide them.
    image: qdrant/qdrant:v1.19.1
    ports:
      # loopback only - the host ingest connects here, nothing else should
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: "no"

volumes:
  qdrant_storage:
